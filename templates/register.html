<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Travel Map Fotos</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">🗺️</span>
      <h1>Travel Map Fotos</h1>
      <p>Crie sua conta gratuita</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/register">
      <label>Usuário</label>
      <input type="text" name="username" placeholder="Escolha um nome de usuário" required autofocus />

      <label>E-mail</label>
      <input type="email" name="email" placeholder="seu@email.com" required />

      <label>Senha</label>
      <input type="password" name="password" placeholder="Mínimo 6 caracteres" required />

      <label>Confirmar senha</label>
      <input type="password" name="confirm_password" placeholder="Repita a senha" required />

      <button type="submit" class="auth-btn">Criar conta</button>
    </form>

    <p class="auth-switch">
      Já tem conta? <a href="/login">Fazer login</a>
    </p>
  </div>
</body>
</html>
