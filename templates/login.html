<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Travel Map Fotos</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">🗺️</span>
      <h1>Travel Map Fotos</h1>
      <p>Entre na sua conta para continuar</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
      <label>Usuário</label>
      <input type="text" name="username" placeholder="Seu nome de usuário" required autofocus />

      <label>Senha</label>
      <input type="password" name="password" placeholder="Sua senha" required />

      <div class="auth-remember">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" />
          Lembrar de mim
        </label>
      </div>

      <button type="submit" class="auth-btn">Entrar</button>
    </form>

    <p class="auth-switch">
      Não tem conta? <a href="/register">Criar conta</a>
    </p>
  </div>
</body>
</html>
